# Alembic configuration for the Hybrid IDS.
#
# The actual DATABASE_URL is read from the environment at runtime by
# alembic/env.py — we do NOT set `sqlalchemy.url` here so local dev,
# docker-compose, and AWS RDS all share the same migration files.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging — quieter by default; flip levels to DEBUG when debugging
# autogenerate diffs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
