# H-IDS dashboard nginx config.
#
# Single-page-app fallback: any path that doesn't map to a file falls
# back to /index.html so React Router can handle client-side routes
# (/dashboard, /alerts, /analytics, /mitre, ...). Without try_files,
# a hard refresh on those routes returns 404.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames (Vite adds a content hash) are safe to
    # cache aggressively; the HTML entry point is not.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA entry document. Security headers live here (not at server
    # level) because nginx's add_header does not merge into locations that
    # set their own — and every SPA route is internally rewritten to
    # /index.html by the try_files fallback below, so this block is what
    # actually serves the HTML. Caddy re-sets the same headers at the public
    # edge (replace semantics) so there are no duplicates in production; this
    # copy protects direct/loopback access.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # SPA fallback — must come after the asset rules so static files win.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip text assets. nginx:alpine ships with brotli off; gzip is
    # enough for the dashboard's bundle size.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml;
}
