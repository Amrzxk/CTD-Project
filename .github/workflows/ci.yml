name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          set -e
          install_req() {
            local path="$1"
            if [ -f "$path" ]; then
              echo "Installing requirements from $path"
              pip install -r "$path"
            else
              echo "No requirements found at $path"
            fi
          }
          install_req api/requirements.txt
          install_req dashboard/requirements.txt
          install_req training/requirements.txt
      - name: Run syntax checks
        run: |
          python -m compileall api dashboard training
