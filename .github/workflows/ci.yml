name: CI

# Tests every new image build on push / PR, and publishes the three
# H-IDS images to GHCR on `main` so deploys pull prebuilt images instead
# of recompiling Snort-from-source on the EC2 box (see deploy.yml +
# docker-compose.deploy.yml).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # required for the GHCR push on `main`

jobs:
  # ── Frontend: install + production build (vite build runs the TS pass) ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build

  # ── Python: byte-compile everything + import the real app graph ──
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Compile all modules
        run: python -m compileall app
      - name: Import smoke test
        # Exercises the full import graph. Safe in a clean env: no DB
        # connection is opened at import, JWT_SECRET is read lazily, and
        # models load only in the FastAPI lifespan (not at import).
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import app.main; print('app.main imported OK')"

  # ── Images: build all three with buildx + GHA layer cache. Push to
  #    GHCR only on main; PRs/branches build-only (validation). ──
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: hids-api
            dockerfile: Dockerfile.api
            context: .
            build_args: ''
          - name: worker
            image: hids-worker
            dockerfile: Dockerfile.worker
            context: .
            build_args: ''
          - name: dashboard
            image: hids-dashboard
            dockerfile: dashboard/Dockerfile
            context: ./dashboard
            # Baked into the JS bundle. `/api` is host-independent and works
            # behind the single-domain Caddy setup; override via the
            # VITE_API_URL repo variable for a bare-IP deploy.
            build_args: VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner (GHCR rejects uppercase).
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build${{ github.ref == 'refs/heads/main' && ' and push' || '' }} ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          # Push only on main (and never on PRs, incl. fork PRs whose token
          # is read-only anyway).
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── Smoke: boot api + postgres + redis from the freshly built API image
  #    and assert /health + login work. Catches migration failures,
  #    boot-time import errors, and model-load regressions. ──
  smoke:
    runs-on: ubuntu-latest
    needs: images
    env:
      POSTGRES_PASSWORD: ci-postgres-pw
      JWT_SECRET: ci-jwt-secret-not-for-production-0123456789
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-pw
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image into the local docker daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: hids-api:ci
          # Reuse the cache the `images` job populated — the Snort source
          # build layer is not recompiled.
          cache-from: type=gha,scope=api

      - name: Write CI compose override
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            api:
              image: hids-api:ci
              build: !reset null
          YAML

      - name: Bring up api + postgres + redis
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres redis api

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "health OK after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; exit 1

      - name: Login smoke test
        run: |
          set -e
          headers=$(curl -fsS -i -X POST http://127.0.0.1:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${ADMIN_USERNAME}\",\"password\":\"${ADMIN_PASSWORD}\"}")
          echo "$headers" | grep -qi 'set-cookie: *hids_session' \
            && echo "login set hids_session cookie OK" \
            || { echo "no hids_session cookie in login response"; echo "$headers"; exit 1; }

      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
