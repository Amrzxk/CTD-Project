# H-IDS local stack
#
# Brings up Redis + FastAPI API + flow meter worker + snort tailer worker.
# Snort itself is NOT containerized here — install it on the host and point
# CAPTURE_INTERFACE / SNORT_ALERT_LOG at the right paths. On AWS the same
# compose works once CAPTURE_INTERFACE is flipped to "vxlan0".
#
# Quickstart:
#   docker compose up -d
#   open http://localhost:8000/health
#   open http://localhost:5173   (run `npm run dev` in dashboard/ separately)

# Shared log-rotation policy. Without this, the json-file driver lets
# container logs grow unbounded and eventually fill the EC2 box's EBS
# volume (gunicorn --access-logfile - logs every request). 10m × 3 files
# per service is a hard ceiling.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: hids-redis
    restart: unless-stopped
    logging: *default-logging
    # Bind to loopback only. Redis runs with no password; the host-network
    # flow_meter still reaches it at 127.0.0.1:6379, but the public internet
    # cannot — the EC2 security group is then only the *second* line of
    # defence, not the only one.
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: hids-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # Loopback-only publish. The API reaches Postgres as `postgres:5432` on
    # the compose network; nothing on the host needs it, so it must not be
    # exposed to the internet. Bound to 127.0.0.1 (not dropped entirely) so
    # `pg_dump`/`psql` over an SSH tunnel still work for ops.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: hids
      # `:?` makes compose refuse to start if POSTGRES_PASSWORD is unset.
      # Prevents the classic "deployed with the default password" footgun.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: hids
    volumes:
      - hids_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hids -d hids"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Explicit tag so the snort_live capture sidecar can reuse this exact
    # image (Snort 3 is already compiled into it) instead of building a
    # second copy. `docker compose build api` produces hids-api:local.
    image: hids-api:local
    container_name: hids-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1100m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Caddy (--profile tls) fronts the API same-origin via the compose network
    # (api:8000), so the host port is loopback-only — for SSH-tunnel debugging.
    # 443 (Caddy) is the sole public entry point; 8000 faces nobody.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MODEL_MODE: "${MODEL_MODE:-auto}"
      # Snort fires per-packet (instant); ML is flow-based and can't emit until
      # NFStream exports the flow -- up to NFSTREAM_ACTIVE_TIMEOUT (120s) later.
      # The joiner holds the first-arriving side this long so the late ML flow
      # joins into `confirmed` instead of the reap emitting a premature
      # `signature_only` that doubles with it. Keep >= active timeout and
      # <= SNORT_HASH_TTL (180).
      CORRELATION_WINDOW_S: "${CORRELATION_WINDOW_S:-130}"
      # Postgres connection — async SQLAlchemy URL. The service name
      # `postgres` resolves on the compose-internal network.
      DATABASE_URL: "postgresql+asyncpg://hids:${POSTGRES_PASSWORD}@postgres:5432/hids"
      # Auth + cookie hardening
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      # Retention + ops
      RETENTION_DAYS: "${RETENTION_DAYS:-90}"
      MAX_PREDICTIONS_HARD_CAP: "${MAX_PREDICTIONS_HARD_CAP:-}"
      # Live PCAP replay drains the whole capture into RAM before publishing,
      # so on a 2 GB box we cap the *live* upload at 512 MiB by default
      # (override in .env). Large captures still go through /analyze/upload,
      # which streams flow-by-flow and is memory-safe.
      LIVE_PCAP_REPLAY_MAX_BYTES: "${LIVE_PCAP_REPLAY_MAX_BYTES:-536870912}"
      # Live sessions are owned by a single in-process registry
      # (LiveSessionRegistry._current). Scaling past one worker requires
      # sticky routing (route /live/session/<id>/* to the worker that
      # holds <id>) — not worth the complexity for a one-analyst SOC
      # tool. Lift this once we add a Redis-backed RPC for session ops.
      API_WORKERS: "${API_WORKERS:-1}"
      SNORT_TAILER_AUTOSTART: "${SNORT_TAILER_AUTOSTART:-0}"
      # Snort 3 is baked into the API image (Ubuntu 24.04 `snort3` package).
      # Native mode — SNORT_WSL_DISTRO is intentionally unset so the offline
      # replay path in app/core/snort_offline.py runs `snort` directly.
      SNORT_BIN: "snort"
      SNORT_CONFIG: "/etc/snort/snort.lua"
      SNORT_OFFLINE_TIMEOUT: "${SNORT_OFFLINE_TIMEOUT:-300}"
    volumes:
      # Mount the models directory so we can swap artifacts without
      # rebuilding the image (essential for the Phase 3 swap-in).
      - ./app/models:/app/app/models:ro
      - ./app/data:/app/app/data:ro
      - ./app/logs:/app/app/logs

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time. Override for staging
        # / AWS by exporting VITE_API_URL before `docker compose build`.
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
        VITE_USE_MOCK: "${VITE_USE_MOCK:-false}"
    container_name: hids-dashboard
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      - api
    ports:
      # Caddy serves the dashboard on 443; this host port is loopback-only for
      # debugging. Public traffic goes through Caddy, never directly here.
      - "127.0.0.1:5173:80"

  flow_meter:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hids-flow-meter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # Gated behind the `capture` profile so it does NOT start by default.
    # It captures the host's PRIMARY interface — i.e. traffic addressed to
    # this box. On a cloud VM that still sees real attacks aimed at the
    # public IP (scans, brute-force, floods), which is a legitimate
    # host/bastion-IDS deployment. It does NOT see *other* machines' traffic
    # without VPC Traffic Mirroring + VXLAN decap. A wrong CAPTURE_INTERFACE
    # crash-loops it: on Nitro EC2 the primary NIC is `ens5`/`enX0`, NOT
    # `eth0` — set CAPTURE_INTERFACE in .env (start_capture.sh auto-detects).
    # Bring up the capture tier with:
    #   docker compose --profile capture up -d flow_meter snort_live snort_tailer
    profiles: ["capture"]
    depends_on:
      redis:
        condition: service_healthy
    # NFStream needs raw-socket access on the host interface. On Linux,
    # share the host network so we capture real traffic; on macOS/Windows
    # NFStream cannot capture the host iface from a container — use the
    # native worker for local dev there.
    network_mode: "host"
    environment:
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
      CAPTURE_INTERFACE: "${CAPTURE_INTERFACE:-eth0}"
      # NFStream flow metering -- KEEP at the values the model was validated on
      # (idle=30, active=120; chosen by the timeout sweep in ReportAI/CLAUDE.md).
      # Do NOT shrink these to "make ML react faster for correlation": under a
      # flood the attacked host's reply latency balloons past a few seconds, so
      # a short idle timeout chops each attack connection into handshake-only
      # fragments (few packets, short, SYN-heavy) that the family classifier
      # reads as Probe/PortScan instead of DoS. Correlation does NOT need a
      # short idle -- the late ML flow looks up the durable snort:<flow_key>
      # hash (SNORT_HASH_TTL) and still emits `confirmed`. FLOW_TTL must outlive
      # the worst-case ML export (~ active timeout).
      NFSTREAM_IDLE_TIMEOUT: "${NFSTREAM_IDLE_TIMEOUT:-30}"
      NFSTREAM_ACTIVE_TIMEOUT: "${NFSTREAM_ACTIVE_TIMEOUT:-120}"
      FLOW_TTL_SECONDS: "${FLOW_TTL_SECONDS:-120}"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: ["python", "-m", "app.core.flow_meter_worker"]

  snort_live:
    # Live Snort 3 sensor for the on-box (host-IDS) capture mode. Reuses the
    # API image (Snort is already compiled into it — Dockerfile.api), running
    # in live mode (`-i <iface>`) instead of the offline `-r <pcap>` path the
    # API uses for upload analysis. Writes alert_json.txt into the shared log
    # dir; the snort_tailer service tails it and publishes to Redis. Together
    # with flow_meter this makes ML / Snort / Hybrid all work live.
    image: hids-api:local
    container_name: hids-snort-live
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    # Same `capture` gating + interface caveats as flow_meter. Build the api
    # image first (`docker compose build api`) so hids-api:local exists.
    profiles: ["capture"]
    # Raw-socket sniffing on the host NIC — same model as flow_meter.
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      # Shared log dir (rw) — snort_tailer mounts the SAME host dir read-only.
      - "${SNORT_LOG_DIR:-./snort_logs}:/var/log/snort"
    # `-i` live capture; alert_json{file=true} in snort.lua writes
    # /var/log/snort/alert_json.txt. --daq-dir points at the source-built DAQ
    # plugins. CAPTURE_INTERFACE must match the host's primary NIC.
    command:
      - "snort"
      - "-c"
      - "/etc/snort/snort.lua"
      - "-i"
      - "${CAPTURE_INTERFACE:-eth0}"
      - "-l"
      - "/var/log/snort"
      - "-A"
      - "alert_json"
      - "-q"
      - "--daq-dir"
      - "/usr/local/lib/daq"

  snort_tailer:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hids-snort-tailer
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    # Same `capture` gating as flow_meter. Tails the alert_json.txt that the
    # snort_live sidecar writes (live mode) — or that an external Snort writes
    # on a host with mirrored traffic. Off by default on the cloud box.
    profiles: ["capture"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SNORT_ALERT_LOG: "/var/log/snort/alert_json.txt"
      # Keep each `snort:<flow_key>` hash alive long enough that a late ML flow
      # (exported up to NFSTREAM_ACTIVE_TIMEOUT later) can still find it and
      # emit `confirmed` instead of `ml-only`. Set >= active timeout + margin.
      SNORT_HASH_TTL: "${SNORT_HASH_TTL:-180}"
    volumes:
      # Mount the Snort 3 log directory from the host (the SAME dir snort_live
      # writes to) so the tailer can follow alert_json.txt as Snort writes it.
      - "${SNORT_LOG_DIR:-./snort_logs}:/var/log/snort:ro"
    command: ["python", "-m", "app.core.snort_tailer_worker"]

  # Reverse proxy + automatic TLS via Let's Encrypt. Gated behind the
  # `tls` profile so it only starts when explicitly requested:
  #     docker compose --profile tls up -d
  # Set DOMAIN in .env to a hostname that resolves to this host (a
  # nip.io name like `hids.1-2-3-4.nip.io` works with zero DNS setup).
  caddy:
    image: caddy:2-alpine
    container_name: hids-caddy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    profiles: ["tls"]
    depends_on:
      - api
      - dashboard
    ports:
      - "80:80"     # ACME HTTP-01 challenge + HTTP→HTTPS redirect
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # Required when --profile tls is active. Compose interpolates env
      # vars before profile filtering, so we can't use ${DOMAIN:?...} here
      # (it would error even when caddy isn't selected). Caddy itself
      # refuses to start without a hostname, which is the right behavior.
      DOMAIN: "${DOMAIN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# Named volume for Postgres data so `docker compose down` doesn't wipe the
# DB (only `docker compose down -v` will).
volumes:
  hids_pgdata:
  caddy_data:
  caddy_config:
